name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    name: Tests - Rust ${{ matrix.rust }} / ClickHouse ${{ matrix.clickhouse }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Supported window: the targeted ClickHouse version (crate 0.MAJOR.MINOR) and the 10
        # releases before it. Keep in sync with `MIN_SUPPORTED_VERSION` and docs/test-fork.sh.
        clickhouse: ["25.11", "25.12", "26.1", "26.2", "26.3", "26.4", "26.5", "26.6", "26.7", "26.8", "26.9"]
        rust: [stable]
        include:
          # MSRV, keep in sync with `rust-version` in the crates' Cargo.toml
          - { rust: "1.89", clickhouse: "26.9" }
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        ports:
          - 9000:9000
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --ulimit nofile=262144:262144
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Build with all features
        run: cargo build --workspace --all-features
      - name: Build without default features
        run: cargo build --workspace --no-default-features
      - name: Run tests
        run: cargo test --workspace --all-features -- --test-threads=1

  rustfmt:
    name: Run rustfmt
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: Check format
        run: cargo fmt --all -- --check

  clippy:
    name: Run clippy
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy
      - name: Check with clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Check docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
